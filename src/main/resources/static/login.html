<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Mini-DMart</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/navbar.css" />
</head>
<body>

  <header class="header">
    <div class="container navbar">
      <a href="/index.html" class="brand-logo">
        🛒 Mini-DMart <span class="logo-badge">Daily Fresh</span>
      </a>
      <div id="authNav"></div>
    </div>
  </header>

  <main style="display:flex; align-items:center; justify-content:center; padding:50px 20px;">
    <div style="background:var(--white); width:100%; max-width:440px; border-radius:var(--radius-lg); border:1px solid var(--gray-200); box-shadow:var(--shadow-md); padding:36px;">
      <div style="text-align:center; margin-bottom:24px;">
        <span style="font-size:2.5rem;">🔐</span>
        <h2 style="font-size:1.5rem; font-weight:800; color:var(--dark); margin-top:8px;">Welcome Back</h2>
        <p style="color:var(--gray-500); font-size:0.9rem;">Sign in to your Mini-DMart account</p>
      </div>

      <!-- Quick Demo Login Buttons -->
      <div style="background:var(--primary-light); padding:12px; border-radius:var(--radius-sm); margin-bottom:20px; text-align:center;">
        <p style="font-size:0.75rem; font-weight:700; color:var(--primary); margin-bottom:8px;">⚡ 1-CLICK DEMO LOGIN</p>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-primary btn-sm" style="flex:1;" onclick="fillDemoCredentials('customer')">Customer Login</button>
          <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="fillDemoCredentials('admin')">Admin Login</button>
        </div>
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:10px;">
          Sign In ➔
        </button>
      </form>

      <div style="text-align:center; margin-top:20px; font-size:0.9rem; color:var(--gray-500);">
        Don't have an account? <a href="/register.html" style="font-weight:700;">Create Account</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function fillDemoCredentials(type) {
      if (type === 'customer') {
        document.getElementById('loginEmail').value = 'customer@dmart.com';
        document.getElementById('loginPassword').value = 'Customer@123';
      } else {
        document.getElementById('loginEmail').value = 'admin@dmart.com';
        document.getElementById('loginPassword').value = 'Admin@123';
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await api.post('/auth/login', { email, password });
        api.setToken(res.token);
        api.setUser({
          id: res.id,
          name: res.name || res.email,
          email: res.email,
          role: res.role
        });

        api.showToast(`Welcome back, ${res.name || res.email}!`, 'success');

        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect');

        setTimeout(() => {
          if (res.role === 'ADMIN' || res.role === 'ROLE_ADMIN') {
            window.location.href = redirect || '/admin/dashboard.html';
          } else {
            window.location.href = redirect || '/index.html';
          }
        }, 800);
      } catch (err) {
        api.showToast(err.message || 'Invalid email or password', 'error');
      }
    }
  </script>
</body>
</html>
